name: Caer
description: >-
  Caer, Inc. is the company behind YUMI (helloyumi.com), a direct-to-consumer
  children's nutrition brand that makes nutritionally-engineered organic snacks
  for babies, toddlers, and kids. The product line includes toddler bars,
  squeezable smoothies-to-go, freeze-dried smoothie melts, super/breakfast bars,
  and soft-baked cookies, all formulated as function-first, nutrient-dense,
  organic, dairy-free, gluten-free, and clean-label. YUMI sells through its own
  WooCommerce storefront, Amazon, and select retail, offering one-time purchases
  and recurring subscription memberships. Backed by 500 Global. This profile was
  seeded as a venture-portfolio stub; it is a consumer packaged-goods e-commerce
  brand with no first-party public developer API, so most API-artifact scoring
  dimensions are not applicable.
